[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoes"
version = "1.0.0"
description = "Compression--Think--Action with privileged on-policy self-distillation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.16.1",
  "verl[verl-core] @ git+https://github.com/verl-project/verl.git@482f86fd09959912c99c0acf2b90329f9e061da7",
  "Pillow>=11.0",
  "PyYAML>=6.0.2",
  "safetensors>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["echoes*"]

[tool.ruff]
target-version = "py310"
line-length = 120
